# Runtime dependency manifest for text2speech.
# The app reads this file on startup for dependency precheck and optional auto-install.

[python]
required = ["google-cloud-texttospeech"]
optional = ["rich"]

[python.imports]
google-cloud-texttospeech = "google.cloud.texttospeech"
rich = "rich"

[commands]
required = ["pdftotext", "ffmpeg"]
optional = ["ocrmypdf", "tesseract"]

[install.brew]
pdftotext = "poppler"
ffmpeg = "ffmpeg"
ocrmypdf = "ocrmypdf"
tesseract = "tesseract"
